<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123a5f" />
    <meta
      name="description"
      content="Лаборатория математики ФН1: учебные планы, конспекты лекций, шаблоны работ, задания, практика, семинары, доклады и конференции."
    />

    <!-- Иконки и PWA-манифест. %BASE_URL% подставляется Vite и равен /<repository>/ -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />

    <title>Лаборатория математики ФН1</title>

    <!--
      Тема применяется до загрузки бандла, иначе при тёмной теме
      на долю секунды мелькает светлый фон.
      Тот же ключ читает и пишет src/theme.jsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('fn1-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.setAttribute('data-bs-theme', theme);
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!--
      SPA-роутинг на GitHub Pages.
      GitHub Pages отдаёт статику и не знает про маршруты вида /disciplines/plans,
      поэтому при прямом заходе/обновлении страницы возвращается 404.html.
      Тот скрипт кодирует исходный путь в query-строку и редиректит на index.html,
      а этот код восстанавливает адрес обратно через history.replaceState —
      React Router получает корректный URL. Приём работает до загрузки бандла.
    -->
    <script>
      (function () {
        var search = window.location.search;
        if (search[1] !== '/') return;
        var decoded = search
          .slice(1)
          .split('&')
          .map(function (part) {
            return part.replace(/~and~/g, '&');
          })
          .join('?');
        window.history.replaceState(
          null,
          null,
          window.location.pathname.slice(0, -1) + decoded + window.location.hash
        );
      })();
    </script>
  </head>
  <body>
    <noscript>Для работы сайта лаборатории требуется включённый JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
